name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # `npm ci` runs the `prepare` script, which builds dist/.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
